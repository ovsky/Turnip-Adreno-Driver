name: Automated Turnip Build & Release

on:
  schedule:
    # Run automatically every Sunday at midnight (UTC)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual triggering from the GitHub Actions UI
  push:
    branches:
      - main
    paths:
      - 'build_turnip.sh'
      - '.github/workflows/build.yml'

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write # Required to create a release and upload assets

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git meson ninja-build patchelf unzip curl flex bison zip cmake pkg-config python3 python3-pip ccache glslang-tools
          pip3 install mako --break-system-packages || pip3 install mako

      - name: Run Turnip Build Script
        id: build
        run: |
          chmod +x build_turnip.sh

          # Pass the GitHub run number to the script as the version
          export BUILD_VERSION="${{ github.run_number }}"

          ./build_turnip.sh

          # Locate the generated zip file in the workdir
          ZIP_PATH=$(find turnip_workdir -name "*.zip" | head -n 1)
          echo "zip_file=${ZIP_PATH}" >> "$GITHUB_OUTPUT"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.zip_file }}
          tag_name: "v${{ github.run_number }}"
          name: "Turnip Adreno Driver - Build ${{ github.run_number }}"
          body: "Automated upstream Mesa (Turnip) build via CI/CD pipeline.\n\nBuilt directly from latest source commits for aarch64-linux-android."
          draft: false
          prerelease: false